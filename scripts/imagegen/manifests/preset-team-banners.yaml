prompt_assembly:
  rule: Concatenate the listed exact_prompt_segments with one newline, in order, to recover the complete prompt sent to the CLI.
  segments:
    style-calibration: |-
      Use case: style-transfer
      Asset type: preset team gallery banner displayed at a stable 2:1 aspect ratio
      Input images: Image 1 dove, Image 2 fire, Image 3 leaves, Image 4 waves, and Image 5 trio are reference images for their high-contrast solid-black silhouette language only; Image 6 login scene is a reference image for soft matte 3D materials, warm diffused light, low-saturation color, and generous negative space only. All images are references, not edit targets.
      Primary request: Create one new wide banner for a fieldwork and planning team family. Show a restrained top-down arrangement of a single continuous black route ribbon passing through a few low matte waypoint forms on a pale sage work surface, suggesting coordinated movement and practical sequencing without depicting a literal map or app UI.
      Style/medium: quiet work-focused sculptural still life; soft matte 3D clay and paper materials paired with crisp solid-black silhouette forms; same visual family as the references without copying their subjects.
      Composition/framing: wide 2:1 crop, one clear focal arrangement, generous calm margins, all important forms safely inside the crop, readable at small card size.
      Lighting/mood: soft indirect studio daylight, calm and precise, gentle short shadows, no dramatic atmosphere.
      Color palette: warm off-white, pale sage, mist blue, one small muted coral accent, and true black; enough tonal separation to remain legible beside both light and dark UI surfaces.
      Materials/textures: unglazed clay, matte paper, very subtle fine grain.
      Constraints: create a new composition; no text, letters, numbers, logos, wordmarks, model marks, mascots, faces, interface screenshots, watermark, or brand imitation; banner art must not be mistaken for member identity.
      Avoid: purple or blue gradients, neon, glossy plastic, bokeh, visual clutter, decorative icon piles, marketing hero composition, cartoon scene, heavy depth of field, excessive roundness.
    shared-v1: |-
      Use case: style-transfer
      Asset type: one preset team gallery banner displayed at a stable 16:9 aspect ratio
      Input images: Image 1 dove, Image 2 fire, Image 3 leaves, Image 4 waves, and Image 5 trio are repo references for their crisp solid-black silhouette language only. Image 6 login scene is the approved repo reference for soft matte 3D paper and clay materials, warm diffused light, low-saturation color, and generous negative space only. Image 7 is a generated style calibration reference for the same quiet photographic material, lighting, scale, and black connector language only. All images are references, not edit targets.
      Series system: quiet work-focused sculptural still life; soft matte 3D clay and paper paired with one or two crisp true-black silhouette anchors; warm off-white base plus restrained existing-team accent colors; one clear focal workflow readable at small card size.
      Composition/framing: exact wide 16:9 composition, centered safe crop, calm margins, all semantic anchors away from edges, no UI copy will overlay the image.
      Lighting/mood: soft indirect studio daylight, calm and precise, gentle short shadows, no dramatic atmosphere.
      Materials/textures: unglazed clay, matte paper, very subtle fine grain.
      Constraints: create a new team-specific composition; no text, letters, numbers, equations, logos, wordmarks, model marks, mascots, faces, interface screenshots, watermark, or brand imitation; banner art must not be mistaken for member identity.
      Avoid: purple-blue gradients, neon, glossy plastic, bokeh, visual clutter, decorative icon piles, marketing hero composition, cartoon scene, excessive cuteness, heavy depth of field, excessive roundness.
    shared-v2: |-
      Use case: style-transfer
      Asset type: one independent preset team gallery banner displayed at a stable 16:9 aspect ratio
      Input images: Image 1 dove, Image 2 fire, Image 3 leaves, Image 4 waves, and Image 5 trio are repo references for their crisp solid-black silhouette language only. Image 6 login scene is the approved repo reference for soft matte 3D paper and clay materials, warm diffused light, low-saturation color, and generous negative space only. Image 7 is a generated style calibration reference for the same quiet photographic material, lighting, scale, and black connector language only. All images are references, not edit targets.
      Series system: quiet work-focused sculptural still life; soft matte 3D clay and blank paper paired with exactly one dominant true-black silhouette or connector anchor; warm off-white base plus restrained existing-team accent colors; one clear focal workflow readable at small card size.
      Composition/framing: exact wide 16:9 composition, centered safe crop, calm margins, all semantic anchors away from edges, no UI copy will overlay the image.
      Lighting/mood: soft indirect studio daylight, calm and precise, gentle short shadows, no dramatic atmosphere.
      Materials/textures: unglazed clay, blank matte paper, very subtle fine grain.
      Constraints: create a new team-specific composition; all paper and cards completely blank; no text-like lines, bullets, letters, numbers, equations, logos, wordmarks, model marks, mascots, faces, interface screenshots, checklists, watermark, or brand imitation; banner art must not be mistaken for member identity.
      Avoid: purple-blue gradients, neon, glossy plastic, bokeh, visual clutter, decorative icon piles, marketing hero composition, cartoon scene, excessive cuteness, heavy depth of field, excessive roundness.
