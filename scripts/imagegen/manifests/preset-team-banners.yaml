      Series system: quiet work-focused sculptural still life; soft matte 3D clay and blank paper paired with exactly one dominant true-black silhouette or connector anchor; warm off-white base plus restrained existing-team accent colors; one clear focal workflow readable at small card size.
      Composition/framing: exact wide 16:9 composition, centered safe crop, calm margins, all semantic anchors away from edges, no UI copy will overlay the image.
      Lighting/mood: soft indirect studio daylight, calm and precise, gentle short shadows, no dramatic atmosphere.
      Materials/textures: unglazed clay, blank matte paper, very subtle fine grain.
      Constraints: create a new team-specific composition; all paper and cards completely blank; no text-like lines, bullets, letters, numbers, equations, logos, wordmarks, model marks, mascots, faces, interface screenshots, checklists, check marks, watermark, or brand imitation; banner art must not be mistaken for member identity.
      Avoid: purple-blue gradients, neon, glossy plastic, bokeh, visual clutter, decorative icon piles, marketing hero composition, cartoon scene, excessive cuteness, heavy depth of field, excessive roundness.
    shared-v4: |-
      Use case: style-transfer
      Asset type: one independent preset team gallery banner displayed at a stable 16:9 aspect ratio
      Input images: Image 1 dove, Image 2 fire, Image 3 leaves, Image 4 waves, and Image 5 trio are repo references for their crisp solid-black silhouette language only. Image 6 login scene is the approved repo reference for soft matte 3D paper and clay materials, warm diffused light, low-saturation color, and generous negative space only. Image 7 is a generated style calibration reference for the same quiet photographic material, lighting, scale, and black connector language only. All images are references, not edit targets.
      Series system: quiet work-focused sculptural still life; soft matte 3D clay and blank paper paired with exactly one dominant true-black structural silhouette or connector anchor; warm off-white base plus restrained existing-team accent colors; one clear rigorous workflow readable at small card size.
      Composition/framing: exact wide 16:9 composition, centered safe crop, calm margins, all semantic anchors away from edges, no UI copy will overlay the image.
      Lighting/mood: soft indirect studio daylight, calm and precise, gentle short shadows, no dramatic atmosphere.
      Materials/textures: unglazed clay, blank matte paper, very subtle fine grain.
      Constraints: create a new team-specific composition; all paper and cards completely blank; no text-like lines, bullets, letters, numbers, equations, mathematical symbols, logos, wordmarks, model marks, atom icons, mascots, faces, interface screenshots, checklists, check marks, watermark, or brand imitation; banner art must not be mistaken for member identity.
      Avoid: purple-blue gradients, neon, glossy plastic, bokeh, visual clutter, decorative icon piles, marketing hero composition, cartoon scene, excessive cuteness, heavy depth of field, excessive roundness.
    mindtrip-v1: |-
      Primary request: Create the independent banner for Mindtrip, a travel-planning crew that reconciles different traveler preferences, route constraints, and budget into one executable itinerary. Use a black route ribbon as the dominant anchor: three small muted preference tokens enter from distinct directions, pass through a compact budget boundary, and merge into one practical path across a few low terrain forms. Make coordinated negotiation and a route that can actually be walked unmistakable without a literal map.
      Semantic accent: restrained teal and pale sage with one small muted coral decision token.
    mindtrip-v2: |-
      Use case: precise-object-edit
      Asset type: final Mindtrip preset team gallery banner at 16:9
      Input images: Image 1 is the edit target. Image 2 is a repo reference for the black continuous route silhouette only. Image 3 is the approved repo material and lighting reference. Image 4 is the series style calibration.
      Primary request: Simplify Image 1 while preserving its wide camera, warm paper-and-clay material, diffused light, black route, teal/sage/coral palette, and generous margins. Remove every literal dove, fire, leaf, plant, and decorative icon. Replace those icons with exactly three small plain geometric preference tokens entering from three directions. Keep one compact pale budget boundary and merge the three inputs into one single executable black path through two low terrain forms toward one muted coral endpoint. Make it unmistakably coordinated travel planning, not a decorative icon collection.
      Constraints: change only the semantic objects described; no text, symbols, letters, numbers, logos, pictograms, arrows, people, faces, UI, watermark, or brand imitation; no extra props; all important forms stay in the centered safe crop.
    elicit-v1: |-
      Primary request: Create the independent banner for Elicit, a research evidence crew that moves from literature discovery through method appraisal to a conclusion limited by evidence strength. Use the repo black leaves silhouette as the main anchor transformed into a branching literature structure: several matte paper leaves enter a black sieve-like review gate, one method layer exposes a gap, and only a smaller evidence stack continues to the conclusion platform. Make search, inclusion, methodological scrutiny, and calibrated synthesis readable as one relay.
      Semantic accent: restrained research blue, sage, and warm paper white.
    harvey-v1: |-
      Primary request: Create the independent banner for Harvey, a contract-reading crew that separates obligations, adverse interpretations, and questions for a professional. Show a small stack of matte contract-like paper slabs with no writing. Two crisp black clause ribbons pull in opposing directions, one sharp folded corner exposes risk, and the flow ends at a neutral question-preparation tray rather than a verdict. The visual must feel sober and document-focused, not judicial theater.
      Semantic accent: restrained deep neutral, pale lavender-gray, and one muted rose risk marker, with no gradient.
    abridge-v1: |-
      Primary request: Create the independent banner for Abridge, a medical-communication crew that turns a user-provided care conversation into an accurate take-home timeline, medication check, and follow-up questions without acting as a doctor. Use the repo black waves silhouette as a calm conversation waveform entering three precise checkpoints, then resolving into an ordered set of matte time and checklist forms. Include one clearly separated uncertainty token that remains for follow-up instead of being silently resolved.
      Semantic accent: restrained dusty rose, soft mint, warm paper white, and true black.
    abridge-v3: |-
      Use case: precise-object-edit
      Asset type: final Abridge preset team gallery banner at 16:9
      Input images: Image 1 is the original Abridge edit target. Image 2 is the repo reference for the solid-black conversation-wave silhouette. Image 3 is the approved repo material and lighting reference.
      Primary request: Preserve Image 1 camera, left-to-right black audio waveform, three source cards, time-and-record hierarchy, dusty rose and soft mint palette, soft paper-and-clay materials, lighting, and large margins. Remove only the black question mark on the coral uncertainty token and every green check mark on the record cards. Keep one simple black clock face as a time marker, but remove any text or numerals. Replace the three checklist outputs with three layered blank clinical-record cards that have visibly different depths and no marks, lines, bullets, or symbols. Keep the coral uncertainty token separate and completely blank.
      Constraints: do not abstract or redesign the overall workflow; no text, letters, numbers, question mark, check marks, checklist lines, logos, people, faces, watermark, or extra props; all important forms stay in the centered safe crop.
    khanmigo-v1: |-
      Primary request: Create the independent banner for Khanmigo, an education crew that finds the exact conceptual gap through questions, gives practice only one step harder, and checks the underlying mistake rather than handing over an answer. Show one black questioning path without a question-mark symbol moving through three progressively higher blank practice blocks. A small muted learner token pauses at a visible gap, then continues only after a separate black feedback loop reconnects the missing step. Make guided progression and diagnosis clear without classroom decoration or literal UI.
      Semantic accent: restrained sky blue, pale sage, warm paper white, and true black.
    flora-v1: |-
      Primary request: Create the independent banner for FLORA, a creative direction crew that deliberately explores three distinct concepts, lets a brand guard reject cliches, then converges on one producible brief. Use one solid-black fire silhouette derived from the repo reference as the controlled creative anchor. Three different blank matte-paper ribbons fan outward, pass through one simple black boundary frame, and converge into a single clean production board with no writing. Show divergence, critique, and practical convergence rather than decorative art supplies.
      Semantic accent: restrained peach, muted coral, pale sage, warm paper white, and true black.
    lindy-v1: |-
      Primary request: Create the independent banner for Lindy, a personal operations crew that reconciles inbox debt, calendar conflicts, and follow-up loops into one executable command surface for today. Show exactly three calm black channels entering from separate blank paper trays, negotiating around two conflicting matte time blocks, then converging onto one raised daily platform. Use no envelope, clock, calendar, checklist, or app icon. One small pending token remains outside the platform to express waiting on someone else.
      Semantic accent: restrained emerald sage, mist blue, warm paper white, and true black.
    glimpse-v1: |-
      Primary request: Create the independent banner for Glimpse, a continuous intelligence crew that distinguishes genuine change from recycled marketing noise and false alarms. Use the repo black waves silhouette as the dominant radar-like signal field without drawing a literal screen. Several low muted wave ridges approach a simple black filter gate; repeated pale echoes stop before the gate while exactly one new coral signal passes through to a small evidence platform. Make change detection and anti-false-positive review unmistakable.
      Semantic accent: restrained deep red-coral, warm gray, pale sage, and true black.
    glimpse-v2: |-
      Use case: precise-object-edit
      Asset type: final Glimpse preset team gallery banner at 16:9
      Input images: Image 1 is the edit target. Image 2 is the repo reference for the wave silhouette. Image 3 is the approved material and lighting reference.
      Primary request: Preserve Image 1 camera, multiple muted signal waves, simple black filter gate, one coral signal passing through, evidence platform, material, lighting, palette, and generous margins. Remove only the black check mark from the coral signal token and the decorative leaf plant beside it. Leave the coral signal token completely plain and the evidence platform otherwise empty. Do not redesign or add anything.
      Constraints: no text, symbols, letters, numbers, check marks, logos, UI, plants, people, faces, watermark, or extra props; centered safe crop.
    nugget-ai-v1: |-
      Primary request: Create the independent banner for Nugget AI, a user-research crew that preserves raw customer voices, clusters recurring themes, keeps counterexamples visible, and only then forms testable product hypotheses. Show several distinct irregular blank paper fragments entering on thin black paths, collecting into two restrained clay clusters while one important dissent fragment remains clearly outside them. A single black synthesis bridge leads from the clusters to one blank hypothesis slab, but the outlier remains connected and visible rather than absorbed. Avoid quote-mark symbols or literal interview UI.
      Semantic accent: restrained ochre, pale sage, warm paper white, and true black.
    winify-ai-v1: |-
      Primary request: Create the independent banner for WinifyAI, a proposal and procurement crew that sorts RFP items into answerable, evidence-required, and must-escalate paths, keeping drafting separate from evidence audit and never inventing capability. Show a stack of blank incoming paper slabs divided by one solid-black sorting spine into exactly three physical lanes. One lane ends in a clean answer tray, one passes through a compact evidence gate, and one ends at a separate muted escalation token. Keep the matrix idea physical and sculptural, not a table or form.
      Semantic accent: restrained indigo-blue used as a flat accent only, warm paper white, pale sage, muted coral, and true black.
    n71-v1: |-
      Primary request: Create the independent banner for N71, an organizational-memory crew that preserves source, time, replacement lineage, and unresolved conflict instead of flattening everything into one summary. Show a sequence of blank matte history slabs connected by one black lineage ribbon. A newer slab clearly supersedes an older slab along the main path, while a second black branch holds two incompatible source fragments apart and leads to a separate neutral human-decision token. Use the repo leaves silhouette once as a black provenance tree anchor, not decoration.
      Semantic accent: restrained slate, pale sage, warm paper white, and one muted coral conflict marker.
    metagpt-v1: |-
      Primary request: Create the independent banner for MetaGPT, a software-building crew that moves from product definition to architecture to one primary implementation stream and then verification, instead of having everyone write code at once. Show a blank brief slab entering a black assembly path, then a compact set of interlocking architecture blocks, then exactly one narrow black implementation ribbon passing through a simple verification gate to a finished blank artifact. Use one small solid-black fire silhouette derived from the repo reference as the forge anchor at the implementation stage, never as decoration.
      Semantic accent: restrained cyan-blue, pale sage, warm paper white, and true black.
    noether-seminar-v1: |-
      Primary request: Create the independent banner for Noether Seminar, a research-mathematics crew where structural and analytical viewpoints build two proof routes, a counterexample reviewer tests missing assumptions and boundaries, and an editor accepts only line-checkable conclusions. Use one black branching-leaf silhouette as the structural route and one black continuous wave ribbon as the analytical route. Keep the routes visibly independent through separate blank lemma blocks, then converge them at one precise central theorem slab. Place a small sharp coral counterexample wedge against the slab boundary and let only the verified result continue to a restrained final paper stack. The image must feel like rigorous proof architecture without equations or classroom motifs.
      Semantic accent: restrained sage, mist blue, warm paper white, one small muted coral boundary wedge, and true black.
    dirac-lab-v1: |-
      Primary request: Create the independent banner for Dirac Lab, a quantum-physics crew that starts from assumptions and a Hamiltonian model, carries out formal derivation, independently checks dimensions and coupling limits, tests a numerical case, and converges on an observable prediction. Use two solid-black coupled wave ribbons around one central interaction gate, with one restrained blue state form and one muted coral state form kept distinct. Route a separate straight black review path through a balance-like pair of equal clay blocks for dimension and limit checking, while a small numerical sample token travels on another path. All three paths must converge on one plain observable disk at the far side. Avoid atom, orbit, particle, laboratory glassware, and science-fiction imagery.
      Semantic accent: restrained mist blue, muted coral, warm paper white, pale sage, and true black.

