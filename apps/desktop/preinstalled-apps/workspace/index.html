<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文件</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-state="message" data-mode="split">
  <aside class="files" aria-label="files" tabindex="0">
    <header class="files-toolbar files-tools">
      <div id="place-switch" class="place-switch" role="group">
        <button type="button" data-root="chat"><gugu-icon name="message-square"></gugu-icon><span></span></button>
        <button type="button" data-root="workspace"><gugu-icon name="monitor"></gugu-icon><span></span></button>
      </div>
      <nav id="crumbs" class="crumbs" hidden></nav>
      <div id="kinds" class="kinds" role="group"></div>
      <button id="search-toggle" class="icon" type="button" aria-expanded="false"><gugu-icon name="search"></gugu-icon></button>
      <input id="filter" class="filter" type="search" autocomplete="off" hidden />
      <button id="sort" class="sort" type="button" aria-haspopup="menu" aria-expanded="false"><span id="sort-label"></span><gugu-icon name="chevron-down"></gugu-icon></button>
      <div id="views" class="views" role="group">
        <button type="button" data-view="list"><gugu-icon name="align-justify"></gugu-icon></button>
        <button type="button" data-view="grid"><gugu-icon name="layout-grid"></gugu-icon></button>
      </div>
      <button id="select-files" class="select-files" type="button" aria-pressed="false"></button>
      <button id="upload" type="button" hidden><gugu-icon name="arrow-up-to-line"></gugu-icon><span id="upload-label" class="sr-only"></span></button>
      <button id="new-doc" class="primary" type="button" aria-haspopup="menu" aria-expanded="false" hidden><gugu-icon name="plus"></gugu-icon><span id="new-label" class="sr-only"></span></button>
    </header>
    <div id="pick-bar" class="pick-bar" role="toolbar" hidden></div>
    <!-- Where the list is (子文件夹): the way up, then each folder from the top. Hidden at the top. -->
    <!-- What went wrong on the list (a name taken there, a failed move or upload): the file's own line is not drawn here. -->
    <div id="list-banner" class="banner" role="status" hidden></div>
    <gugu-empty id="files-empty" icon="folder" hidden><strong id="files-empty-message"></strong><button id="empty-upload" type="button" hidden></button></gugu-empty>
    <ul id="file-list" class="file-list list" role="listbox" aria-multiselectable="true"></ul>
  </aside>
  <main class="doc">
    <header class="doc-head">
      <nav class="page-navigation">
        <button id="page-back" type="button"><gugu-icon name="arrow-left"></gugu-icon><span id="page-back-label"></span></button>
      </nav>
      <nav id="doc-path" class="doc-path" hidden></nav>
      <h1 id="doc-title" class="doc-title"></h1>
      <div class="doc-actions">
        <!-- One toggle (owner 11-06): it shows the mode a press goes to — ✎ while reading, 👁 while editing; 对照 is in ⋯. -->
        <div class="modes">
          <button id="mode-preview" type="button"><gugu-icon name="eye"></gugu-icon></button>
          <button id="mode-edit" type="button"><gugu-icon name="pencil"></gugu-icon></button>
          <button id="mode-split" type="button" hidden><gugu-icon name="columns-2"></gugu-icon></button>
        </div>
        <div id="doc-info" class="doc-info" hidden></div>
        <span id="doc-status" class="status"></span>
        <div id="peers" class="peers"></div>
        <div class="json-actions">
          <button id="json-discard" type="button"></button>
          <button id="json-apply" class="primary" type="button"></button>
        </div>
        <!-- These two fold behind ⋯ at every width (owner 10-30, folder-docs): it opens them in the page's one menu (#menu). -->
        <button id="download" class="fold" type="button" hidden></button>
        <button id="open-with" class="fold" type="button" hidden></button>
        <button id="more" class="more-toggle" type="button" aria-haspopup="menu" aria-expanded="false" hidden><gugu-icon name="more-horizontal"></gugu-icon></button>
      </div>
    </header>
    <div id="banner" class="banner" role="status" hidden></div>
    <p id="doc-message" class="empty doc-message"></p>
    <p id="preview-cut" class="preview-cut" hidden></p>
    <div class="panes">
      <div id="editor" class="editor"></div>
      <article id="preview" class="preview" tabindex="-1"></article>
      <!-- An empty document, where its preview would be: what can be done here. -->
      <gugu-empty id="doc-empty" class="doc-empty" icon="file-text" hidden><strong id="doc-empty-title"></strong><small id="doc-empty-hint"></small><span class="row"><button id="empty-write" class="primary" type="button"><gugu-icon name="pencil"></gugu-icon><span id="empty-write-label"></span></button><button id="empty-draft" type="button"><gugu-icon name="sparkles"></gugu-icon><span id="empty-draft-label"></span></button></span></gugu-empty>
    </div>
  </main>
  <!-- Transfers under way: under the list or the open file, whichever is showing. -->
  <div id="transfer" class="transfer" role="status" hidden></div>
  <!-- A file's details: beside the list when the pane is wide, over it when narrow. -->
  <aside id="details" class="details card" aria-label="details" hidden></aside>
  <div id="menu" class="menu card list" role="menu" hidden></div>
  <!-- The frame dragged across the list. -->
  <div id="lasso" class="lasso" hidden></div>
  <!-- One action control for a source block, only while editing. -->
  <div id="block-controls" class="block-controls" hidden>
    <button id="block-handle" class="block-handle" type="button" aria-haspopup="menu" aria-expanded="false"><gugu-icon name="more-horizontal"></gugu-icon></button>
  </div>
  <!-- 「移动到…」: every folder of the chat, the top first; a press moves the file there. -->
  <div id="move-dialog" class="dialog" role="dialog" aria-modal="true" hidden>
    <div class="dialog-box card">
      <h2 id="move-title" class="dialog-title"></h2>
      <ul id="move-targets" class="move-targets"></ul>
      <div class="dialog-actions"><button id="move-cancel" type="button"></button></div>
    </div>
  </div>
  <!-- After an upload: a name that was already in the folder — both kept, or the old one replaced. -->
  <div id="conflicts" class="dialog" role="dialog" aria-modal="true" hidden>
    <div class="dialog-box card">
      <ul id="conflict-list" class="conflict-list"></ul>
      <div class="dialog-actions"><button id="conflicts-done" type="button"></button></div>
    </div>
  </div>
  <!-- Beside a selection, in the source or the preview (app.js places it). -->
  <div id="sel-bar" class="sel-bar" hidden>
    <!-- In the source only: the marks a selection is wrapped in (the same text everyone edits). -->
    <span class="fmt-bar">
      <button id="fmt-bold" class="fmt" type="button" data-fmt="bold"><gugu-icon name="bold"></gugu-icon></button>
      <button id="fmt-italic" class="fmt" type="button" data-fmt="italic"><gugu-icon name="italic"></gugu-icon></button>
      <button id="fmt-code" class="fmt" type="button" data-fmt="code"><gugu-icon name="braces"></gugu-icon></button>
      <button id="fmt-link" class="fmt" type="button" data-fmt="link"><gugu-icon name="link"></gugu-icon></button>
    </span>
    <button id="copy-sel" type="button"></button>
    <button id="cite-sel" type="button"></button>
    <button id="hold-sel" type="button"></button>
  </div>
  <!-- The places kept with ＋, cited together (the 演示稿's way of gathering): at the bottom of the file. -->
  <div id="held-bar" class="held-bar" role="toolbar" hidden>
    <span id="held-count" class="held-count"></span>
    <button id="held-cite" class="held-cite" type="button"></button>
    <button id="held-clear" class="held-clear" type="button">✕</button>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
