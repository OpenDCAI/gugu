<script>
// The existing brand-motion.html / website footer supplies the font and dot sampling.
// Startup has its own short timing; authentication's presentation animation stays unchanged.
(async () => {
  const ENTER_MS = 1200, WAVE_MS = 2000;
  let RGB = '__MOTION_RGB__';
  const attemptId = document.documentElement.dataset.attempt;
  let held = document.documentElement.dataset.held === 'true';

    const metrics = c.measureText('gugu');
