<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Standup Board</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column; gap: 12px; padding: 14px;
    font: 13px/1.55 ui-sans-serif, -apple-system, "PingFang SC", system-ui, sans-serif;
    background: var(--em-background); color: var(--em-foreground);
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex: none; }
  h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .sub { font-size: 12px; color: var(--em-foreground-muted); }
  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 640px) { .cols { grid-template-columns: 1fr; overflow: auto; } }
  .col { display: flex; flex-direction: column; min-height: 0;
         border: 1px solid var(--em-border); border-radius: 10px;
         background: var(--em-background-3); }
  .colhead {
    flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    border-bottom: 1px solid var(--em-border); font-size: 11.5px; letter-spacing: .04em;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .count { margin-left: auto; font-variant-numeric: tabular-nums;
           color: var(--em-foreground-muted); }
  .items { flex: 1; min-height: 0; overflow: auto; padding: 6px; display: flex;
           flex-direction: column; gap: 5px; }
  .card {
    padding: 7px 8px; border-radius: 7px; cursor: pointer;
    background: color-mix(in srgb, var(--em-foreground) 5%, transparent);
    border: 1px solid transparent;
  }
  .card:hover { border-color: var(--em-accent-11); }
  .text { font-size: 12px; }
  .where { margin-top: 3px; font-family: ui-monospace, monospace; font-size: 10.5px;
           color: var(--em-foreground-muted); overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 24px 8px; text-align: center; font-size: 12px;
           color: var(--em-foreground-muted); }
</style>
</head>
<body>
  <div class="head">
    <h2>今天该说什么</h2>
    <div class="sub" id="sub">正在扫描工作副本…</div>
  </div>
  <div class="cols" id="cols"></div>

  <script src="board.js"></script>
</body>
</html>
