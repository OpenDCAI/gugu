<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Regex Forge</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column; gap: 10px;
    padding: 14px;
    font: 13px/1.5 ui-sans-serif, -apple-system, "PingFang SC", system-ui, sans-serif;
    background: var(--em-background); color: var(--em-foreground);
  }
  .row { display: flex; gap: 8px; align-items: center; }
  input, textarea {
    width: 100%; padding: 7px 9px; border-radius: 7px;
    border: 1px solid var(--em-border);
    background: var(--em-background-3); color: inherit;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--em-accent-11); }
  textarea { flex: 1; resize: none; line-height: 1.7; }
  .flags { display: flex; gap: 4px; }
  .flag {
    padding: 5px 8px; border-radius: 6px; cursor: pointer; user-select: none;
    border: 1px solid var(--em-border); font-family: ui-monospace, monospace;
    color: var(--em-foreground-muted);
  }
  .flag[aria-pressed="true"] { background: var(--em-accent-11); color: #fff; border-color: transparent; }
  .out {
    flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--em-border); background: var(--em-background-3);
    white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.8;
  }
  mark { background: var(--em-accent-11); color: #fff; border-radius: 3px; padding: 0 1px; }
  mark:nth-of-type(even) { background: color-mix(in srgb, var(--em-accent-11) 62%, #000); }
  .status { font-size: 12px; color: var(--em-foreground-muted); min-height: 18px; }
  .status.bad { color: var(--em-foreground-destructive); }
  .groups { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 2px 7px; border-radius: 999px; font-size: 11.5px;
    background: color-mix(in srgb, var(--em-foreground) 10%, transparent);
    font-family: ui-monospace, monospace;
  }
  label { font-size: 11.5px; color: var(--em-foreground-muted); letter-spacing: .02em; }
</style>
</head>
<body>
  <div>
    <label for="pattern">模式</label>
    <div class="row" style="margin-top:4px">
      <input id="pattern" spellcheck="false" placeholder="\b(\w+)@(\w+\.\w+)\b" />
      <div class="flags" id="flags"></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-height:0">
    <label for="subject">测试文本</label>
    <textarea id="subject" spellcheck="false"></textarea>
  </div>

  <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-height:0">
    <label>匹配</label>
    <div class="out" id="out"></div>
  </div>

  <div class="status" id="status"></div>
  <div class="groups" id="groups"></div>

  <script src="forge.js"></script>
</body>
</html>
