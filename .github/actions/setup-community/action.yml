name: Set up community toolchain
description: Install the pinned public toolchain without internal runners or credentials
inputs:
  save-cache:
    description: >-
      Save installed dependencies after an exact miss, only on a dev push. Exactly one job per
      runner OS sets this; PR/manual callers always restore without writing PR-scoped archives.
    required: false
    default: 'false'
outputs:
  node-version:
    description: Exact Node version selected for the job.
    value: ${{ steps.node.outputs.node-version }}
  source-tree:
    description: Content address of the checked-out source snapshot.
    value: ${{ steps.cache-paths.outputs.source-tree }}
runs:
  using: composite
  steps:
    # Persistent Mac checkouts retain dependency content; remove all other stale source
    # before pnpm reads any workspace configuration, then validate with frozen install.
    - name: Clean source while preserving checkout-local dependency caches
      if: runner.environment == 'self-hosted' && runner.os == 'macOS'
      shell: bash
      run: |
        cd -- "${GITHUB_WORKSPACE:?}"
        test "$(git rev-parse --show-prefix)" = ''
        git clean -ffdx -e node_modules -e .ci-cache
    - uses: pnpm/action-setup@v4
    - id: node
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    - id: cache-paths
      shell: bash
      run: |
        echo "source-tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
        # Workspace-relative archives restore into either hosted or isolated runner checkouts.
        echo 'pnpm-store=.ci-cache/pnpm' >> "$GITHUB_OUTPUT"
        echo 'electron=.ci-cache/electron' >> "$GITHUB_OUTPUT"
        # Persistent Mac runners already have warm per-runner stores. A ~1 GB remote restore
        # takes minutes there; use pnpm/Electron's existing local caches as before instead.
        if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ "$RUNNER_OS" = macOS ]; then
          echo 'local-cache=true' >> "$GITHUB_OUTPUT"
        else
          echo 'local-cache=false' >> "$GITHUB_OUTPUT"
          echo "electron_config_cache=$GITHUB_WORKSPACE/.ci-cache/electron" >> "$GITHUB_ENV"
        fi
    # Keyed on the lockfile; on a lockfile change the newest older store is restored and pnpm only
    # downloads the difference.
    - if: steps.cache-paths.outputs.local-cache != 'true'
      id: pnpm-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.cache-paths.outputs.pnpm-store }}
        key: community-pnpm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: community-pnpm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-
    - if: steps.cache-paths.outputs.local-cache != 'true'
      id: electron-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.cache-paths.outputs.electron }}
        key: community-electron-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: community-electron-v2-${{ runner.os }}-${{ runner.arch }}-
    - if: steps.cache-paths.outputs.local-cache != 'true'
      shell: bash
      env:
        PNPM_CACHE_HIT: ${{ steps.pnpm-cache.outputs.cache-hit }}
        ELECTRON_CACHE_HIT: ${{ steps.electron-cache.outputs.cache-hit }}
      run: node scripts/ci/seed-community-caches.mjs
    - if: steps.cache-paths.outputs.local-cache == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
    - if: steps.cache-paths.outputs.local-cache != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline --store-dir "$GITHUB_WORKSPACE/.ci-cache/pnpm"
    - if: steps.cache-paths.outputs.local-cache != 'true' && inputs.save-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.cache-paths.outputs.pnpm-store }}
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
    - if: steps.cache-paths.outputs.local-cache != 'true' && inputs.save-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.electron-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.cache-paths.outputs.electron }}
        key: ${{ steps.electron-cache.outputs.cache-primary-key }}
