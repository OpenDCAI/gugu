name: Set up Playwright Chromium
description: Restore the Playwright browser cache for the installed Playwright version, then install Chromium
inputs:
  container-image:
    description: Pull a pinned official image for run-in-container.sh instead of installing browsers on the host.
    required: false
    default: ''
  with-deps:
    description: Also install the browser's system packages (Linux runners).
    required: false
    default: 'false'
  save-cache:
    description: Save the browser cache at the end of the job when the exact key missed (one job per runner OS).
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - if: inputs.container-image != ''
      shell: bash
      env:
        IMAGE: ${{ inputs.container-image }}
      run: docker pull "$IMAGE"
    - if: inputs.container-image == ''
      id: playwright
      shell: bash
      run: |
        echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        echo 'browsers=.ci-cache/playwright' >> "$GITHUB_OUTPUT"
        if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ "$RUNNER_OS" = macOS ]; then
          echo 'local-cache=true' >> "$GITHUB_OUTPUT"
        else
          echo 'local-cache=false' >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=$GITHUB_WORKSPACE/.ci-cache/playwright" >> "$GITHUB_ENV"
        fi
    - if: inputs.container-image == '' && steps.playwright.outputs.local-cache != 'true'
      id: browser-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.playwright.outputs.browsers }}
        key: playwright-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    # With the browsers restored this only verifies them (and, with deps, installs the apt packages).
    - if: inputs.container-image == ''
      shell: bash
      env:
        WITH_DEPS: ${{ inputs.with-deps }}
      run: |
        if [ "$WITH_DEPS" = true ]; then
          pnpm exec playwright install --with-deps chromium
        else
          pnpm exec playwright install chromium
        fi
    - if: inputs.container-image == '' && steps.playwright.outputs.local-cache != 'true' && inputs.save-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.browser-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.playwright.outputs.browsers }}
        key: ${{ steps.browser-cache.outputs.cache-primary-key }}
