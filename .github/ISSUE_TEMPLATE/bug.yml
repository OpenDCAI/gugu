name: Bug
description: Something is broken or does not behave as expected
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Expected behavior vs. actual behavior
      placeholder: |
        Expected: …
        Actual: …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS / version / build (e.g. macOS 14 / 0.x.x / dev)
    validations:
      required: false
