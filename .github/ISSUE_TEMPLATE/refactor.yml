name: Refactor
description: Architecture refactoring, API simplification, technical debt
title: "[Refactor] "
labels: [refactor]
body:
  - type: textarea
    id: current
    attributes:
      label: Current problem
      description: What is uncomfortable about the current structure or API
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target shape
      description: What it should look like after the refactor
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which modules and callers are affected
    validations:
      required: false
