name: Feature
description: A new capability or request
title: "[Feature] "
labels: [feature]
body:
  - type: textarea
    id: motivation
    attributes:
      label: What problem does it solve
      description: Why is it needed, and who will use it
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: UI, API or interaction sketches are all welcome
    validations:
      required: false
