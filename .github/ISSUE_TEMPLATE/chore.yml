name: Chore
description: Tests, packaging, cherry-picks, repository maintenance — anything that is not a bug, feature or refactor
title: "[Chore] "
labels: [chore]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs to be done
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is needed
      description: Without the motivation, nobody will remember why it was queued
    validations:
      required: true
