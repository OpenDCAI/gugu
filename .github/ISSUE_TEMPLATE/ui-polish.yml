name: UI Polish
description: Small UI/UX refinements that do not affect functionality
title: "[UI Polish] "
labels: [ui-polish]
body:
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Page, component or entry point
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What feels off
      description: Copy, spacing, contrast, motion, interaction…
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag and drop to upload
    validations:
      required: false
