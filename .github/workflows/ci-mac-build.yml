name: Trusted macOS CI build
on:
  workflow_call:
    inputs:
      build-required:
        description: Original changes job decision; never grants runner access.
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CI: true
  GUGU_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  GUGU_SUPABASE_ANON_KEY: community-build-placeholder
  VITE_SUPABASE_ANON_KEY: community-build-placeholder
  # Match pnpm-lock.yaml; update the version and digest together when Playwright changes.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
jobs:
  route:
    name: Route
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - id: route
        env:
          ORIGINAL_EVENT_NAME: ${{ github.event_name }}
          ORIGINAL_WORKFLOW_REF: ${{ github.workflow_ref }}
        # No checkout or caller input: all trust decisions use the original GitHub context/event.
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.pull_request;
          const trusted = process.env.ORIGINAL_EVENT_NAME === 'pull_request'
            && event.repository?.full_name === 'GUYI-AI/gugu'
            && event.repository?.id === 1428236928
            && ['opened', 'synchronize', 'reopened'].includes(event.action)
            && pr?.head?.repo?.full_name === 'GUYI-AI/gugu'
            && pr?.head?.repo?.id === 1428236928
            && pr?.head?.ref === 'integration/beta-20261103'
            && pr?.base?.repo?.full_name === 'GUYI-AI/gugu'
            && pr?.base?.repo?.id === 1428236928
            && pr?.base?.ref === 'dev'
            && Number.isSafeInteger(pr?.number) && pr.number > 0
            && process.env.ORIGINAL_WORKFLOW_REF === `GUYI-AI/gugu/.github/workflows/ci.yml@refs/pull/${pr.number}/merge`;
          const runner = trusted ? ['self-hosted', 'macOS', 'ARM64', 'gugu-public-mac1'] : ['macos-15'];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `runner=${JSON.stringify(runner)}\n`);
          NODE
  build:
    name: Build
    needs: route
    if: inputs.build-required == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 45
    env:
      GUGU_CLOUD_COMPUTER_ENABLED: 'false'
      VITE_GUGU_CLOUD_COMPUTER_ENABLED: 'false'
      GUGU_PLATFORM_MODELS_ENABLED: 'false'
      VITE_GUGU_PLATFORM_MODELS_ENABLED: 'false'
      # The renderer bundle peaks around 4 GB of V8 heap; Node's default cap on 7 GB hosted runners is ~2 GB.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: command -v tmux || brew install tmux
      - uses: ./.github/actions/setup-community
      - run: pnpm build:app:ci
        env:
          GUGU_BUILD_SERIAL: '1'
      - run: pnpm rebuild:native
