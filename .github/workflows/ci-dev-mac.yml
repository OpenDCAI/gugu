name: Dev Mac build
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: community-ci-dev-mac
  cancel-in-progress: true
env:
  CI: true
  GUGU_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  GUGU_SUPABASE_ANON_KEY: community-build-placeholder
  VITE_SUPABASE_ANON_KEY: community-build-placeholder
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
jobs:
  desktop-build-mac:
    name: Dev desktop app build (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GUGU_CLOUD_COMPUTER_ENABLED: 'false'
      VITE_GUGU_CLOUD_COMPUTER_ENABLED: 'false'
      GUGU_PLATFORM_MODELS_ENABLED: 'false'
      VITE_GUGU_PLATFORM_MODELS_ENABLED: 'false'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - run: command -v tmux || brew install tmux
      - uses: ./.github/actions/setup-community
      - run: pnpm build:app:ci
        env:
          GUGU_BUILD_SERIAL: '1'
      - run: pnpm rebuild:native
      - name: Report a failed dev Mac build
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'ci-mac-red';
            const marker = `<!-- ci-dev-mac:${context.sha} -->`;
            const title = `Dev Mac build failed at ${context.sha.slice(0, 7)}`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const actor = context.payload.sender?.login || context.actor;
            const body = [
              marker,
              `The macOS build failed after a push to dev.`,
              `Commit: ${context.sha}`,
              `Merged/pushed by: @${actor}`,
              `Run: ${runUrl}`,
              `Inspect the build and native-rebuild logs before the next release.`,
            ].join('\n\n');
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name: label, color: 'b60205',
                  description: 'The macOS build failed on dev',
                });
              } catch (labelError) {
                if (labelError.status !== 422) throw labelError;
                await github.rest.issues.getLabel({ owner, repo, name: label });
              }
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: label, state: 'all', per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, title, body, state: 'open',
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }
