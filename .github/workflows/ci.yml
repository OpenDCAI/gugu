name: Projection timeout investigation 1863
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: true
  GUGU_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  GUGU_SUPABASE_ANON_KEY: community-build-placeholder
  VITE_SUPABASE_ANON_KEY: community-build-placeholder
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  TZ: UTC
jobs:
  measure:
    name: Five projection-media phase samples
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-community
      - uses: ./.github/actions/setup-playwright
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.0
          cache-dependency-path: apps/desktop/native/projection-media/go.sum
      - name: Build the original real race helper
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          go -C apps/desktop/native/projection-media build -p 2 -race -buildvcs=false -o "$RUNNER_TEMP/projection-media-factory" ./cmd/projection-media
          printf '%s\n' "GUGU_TEST_MEDIA_HELPER=$RUNNER_TEMP/projection-media-factory" "GUGU_PROJECTION_FFMPEG=$(command -v ffmpeg)" "GUGU_TEST_CHROMIUM=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"
      - name: Record five independent samples without retries or changed deadlines
        shell: bash
        env:
          GUGU_BROWSER_REAL_ELECTRON: ./node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
        run: |
          set -uo pipefail
          node -e 'console.log(JSON.stringify({node:process.version,arch:process.arch,cpus:require("node:os").availableParallelism(),load:require("node:os").loadavg()}))'
          failed=0
          for sample in 1 2 3 4 5; do
            export GUGU_BROWSER_PROBE_REPORT_DIR="$RUNNER_TEMP/projection1863-$sample"
            export GUGU_HOME="$GUGU_BROWSER_PROBE_REPORT_DIR/parent-home"
            export GUGU_USER_DATA_DIR="$GUGU_BROWSER_PROBE_REPORT_DIR/parent-user-data"
            mkdir -p "$GUGU_BROWSER_PROBE_REPORT_DIR" "$GUGU_HOME" "$GUGU_USER_DATA_DIR"
            printf 'SAMPLE_START=%s\n' "$sample"
            pnpm exec vitest run --project session-main apps/desktop/electron/session/main/core/extensions/projection-media.real-electron.test.ts
            code=$?
            printf 'SAMPLE_EXIT=%s:%s\n' "$sample" "$code"
            for report in "$GUGU_BROWSER_PROBE_REPORT_DIR"/*.json "$GUGU_BROWSER_PROBE_REPORT_DIR"/*.log; do
              if [ -f "$report" ]; then printf 'REPORT=%s\n' "$(basename "$report")"; cat "$report"; printf '\n'; fi
            done
            if [ "$code" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
